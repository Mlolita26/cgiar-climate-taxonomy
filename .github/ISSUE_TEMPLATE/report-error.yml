name: Report an error
description: A mistake in the data, a web page or a download file
title: "[Error] "
labels: ["error"]
body:
  - type: input
    id: where
    attributes:
      label: Where
      description: The page address, the file, or the term identifier.
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What is wrong
      description: What you see, and what you expected.
    validations:
      required: true
