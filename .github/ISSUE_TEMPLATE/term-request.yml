name: New term
description: Propose a concept that the climate taxonomy does not have yet
title: "[Term] "
labels: ["term-request", "new term"]
body:
  - type: markdown
    attributes:
      value: |
        Before proposing, search the taxonomy (https://mlolita26.github.io/cgiar-climate-taxonomy/browse.html): if the concept exists under another word, propose a **synonym** instead. How proposals are decided: [GOVERNANCE.md](https://github.com/Mlolita26/cgiar-climate-taxonomy/blob/main/GOVERNANCE.md).
  - type: input
    id: term
    attributes:
      label: Term
      description: The preferred label, sentence case, one concept.
      placeholder: e.g. Heat stress tolerance
    validations:
      required: true
  - type: textarea
    id: definition
    attributes:
      label: Definition
      description: One or two sentences, opening with the broader concept (genus-differentia).
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Definition source
      description: The authority the definition draws on (IPCC, AGROVOC, FAO, WMO, UNFCCC, or a cited publication).
    validations:
      required: true
  - type: input
    id: facet_parent
    attributes:
      label: Facet and broader term
      placeholder: e.g. Breeding trait, under Abiotic stress tolerance (TRT_...)
  - type: input
    id: synonyms
    attributes:
      label: Synonyms
      description: Other words people use for the same concept, separated by semicolons.
  - type: textarea
    id: evidence
    attributes:
      label: Evidence of use
      description: Where does this term appear in CGIAR work? Quote or link one or two examples (PRMS results, plans, reports).
  - type: input
    id: orcid
    attributes:
      label: Your ORCID (optional)
      description: So that the contribution can be credited in the release notes.
      placeholder: 0000-0000-0000-0000
