# Runs the vocabulary checks (qa/check_skos.R) whenever the vocabulary, its build or the checks change.
name: QA

on:
  push:
    branches: [main]
    paths: ["source/**", "dist/**", "docs/dist/**", "docs/terms/**", "docs/data/**", "qa/check_skos.R", "build_fair.R", ".github/workflows/qa.yml"]
  pull_request:
    paths: ["source/**", "dist/**", "docs/dist/**", "docs/terms/**", "docs/data/**", "qa/check_skos.R", "build_fair.R", ".github/workflows/qa.yml"]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::dplyr
            any::purrr
            any::readr
            any::stringr
            any::jsonlite
            any::rdflib
      - name: Check the vocabulary
        run: Rscript qa/check_skos.R
